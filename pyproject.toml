[project]
name = "bbl"
version = "0.1.0"
description = "Polymarket copytrade bot & trader analyzer"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "tenacity>=8.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
analyze = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "networkx>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
bbl = "bbl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
